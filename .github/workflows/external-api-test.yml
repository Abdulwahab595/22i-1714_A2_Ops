name: External network API verification
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Public base URL of the deployed VisionGuard service
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify-from-github-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1
      - name: Upload two known samples and verify database history
        env:
          MODEL_API_URL: ${{ inputs.api_url }}
          MODEL_API_TOKEN: ${{ secrets.MODEL_API_TOKEN }}
        run: python -m scripts.verify_deployment --output external-network-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-network-results
          path: external-network-results.json
